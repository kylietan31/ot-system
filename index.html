<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaizen Mould Technology - 极简请假与病假申报系统</title>
<style>
  :root {
    --primary: #0284c7;
    --primary-hover: #0369a1;
    --bg: #f0f9ff;
    --card-bg: #ffffff;
    --text: #0c4a6e;
    --border: #bae6fd;
    --mc-color: #dc2626;
    --el-color: #d97706;
    --al-color: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg); color: #1e293b; padding: 15px; display: flex; justify-content: center; }
  .app-container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 16px; padding: 22px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.12); }
  
  .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e0f2fe; padding-bottom: 12px; }
  .header h1 { font-size: 22px; color: var(--text); font-weight: 800; }
  .header p { font-size: 13px; color: #64748b; margin-top: 4px; }

  .notice-banner { background: #fffaf0; border-left: 4px solid #f59e0b; padding: 12px; font-size: 13px; color: #78350f; border-radius: 6px; margin-bottom: 18px; line-height: 1.5; }
  
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #334155; }
  select, input, textarea { width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; background: #fff; }
  select:focus, input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2); }
  
  /* 假别快捷选择按键 */
  .type-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 6px; }
  .type-card {
    padding: 14px 6px; border: 2px solid #e2e8f0; border-radius: 10px; background: #f8fafc; text-align: center; cursor: pointer; font-weight: bold; font-size: 13px; color: #64748b; user-select: none; transition: all 0.2s;
  }
  .type-card.active-mc { border-color: var(--mc-color); background: #fef2f2; color: var(--mc-color); }
  .type-card.active-el { border-color: var(--el-color); background: #fffbeb; color: var(--el-color); }
  .type-card.active-al { border-color: var(--al-color); background: #eff6ff; color: var(--al-color); }

  .upload-box { border: 2px dashed #0284c7; padding: 18px; border-radius: 10px; text-align: center; background: #f0f9ff; cursor: pointer; transition: background 0.2s; }
  .upload-box:hover { background: #e0f2fe; }
  .upload-box input { display: none; }

  .submit-btn { width: 100%; padding: 16px; background: var(--primary); color: #fff; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35); }
  .submit-btn:hover { background: var(--primary-hover); }

  .success-alert { display: none; background: #16a34a; color: white; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-top: 15px; line-height: 1.5; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>Kaizen Mould Technology</h1>
    <p>🏥 全员电子请假 & 病假 (MC) 快速申报系统</p>
  </div>

  <div class="notice-banner">
    📢 <strong>请假新规定：</strong> 取消所有 WhatsApp/电话口头请假。选好工号与假别代码提交，如有病假必须拍照上传 MC。返回公司后须向 HR 提交纸质正本。
  </div>

  <form id="eLeaveForm">
    <!-- 1. 按工号/名字快速查找 -->
    <div class="form-group">
      <label>🔍 1. 选择员工（按工号或名字）：</label>
      <select id="empSelect" onchange="onEmployeeChange()" required>
        <option value="">-- 请选择员工 / Select Employee --</option>
      </select>
    </div>

    <!-- 2. 部门自动带出 -->
    <div class="form-group">
      <label>🏢 所属部门 (Department)：</label>
      <input type="text" id="deptInput" placeholder="选择员工后自动填充" readonly style="background:#f1f5f9; color:#64748b;">
    </div>

    <!-- 3. 极简假别代号选择 -->
    <div class="form-group">
      <label>📌 2. 选择假别代码按键：</label>
      <div class="type-grid">
        <div class="type-card active-mc" id="cardMC" onclick="chooseType('MC')">代码 1<br>MC (病假)</div>
        <div class="type-card" id="cardEL" onclick="chooseType('EL')">代码 2<br>EL (紧急假)</div>
        <div class="type-card" id="cardAL" onclick="chooseType('AL')">代码 3<br>AL/RL (普通假)</div>
      </div>
      <input type="hidden" id="leaveType" value="MC">
    </div>

    <!-- 4. 请假日期 -->
    <div class="form-group">
      <label>📅 3. 请假日期 (Leave Date)：</label>
      <input type="date" id="leaveDate" required>
    </div>

    <!-- 5. 拍照上传病单 (仅在选择 MC 时出现) -->
    <div class="form-group" id="mcSection">
      <label>📸 4. 拍摄/上传诊所病单 (MC Photo)：</label>
      <div class="upload-box" onclick="document.getElementById('mcCamera').click()">
        <span id="uploadLabel">📷 点击直接拍摄或上传 MC 照片</span>
        <input type="file" id="mcCamera" accept="image/*" capture="environment" onchange="onFileSelected(this)">
      </div>
    </div>

    <!-- 6. 备注/原因 -->
    <div class="form-group">
      <label>📝 请假事由 / 备注 (Reason)：</label>
      <input type="text" id="leaveReason" placeholder="例：发烧看诊 / 紧急家事">
    </div>

    <button type="button" class="submit-btn" onclick="submitLeaveApp()">🚀 立即提交请假 (Submit Leave)</button>
  </form>

  <div id="successMessage" class="success-alert">
    ✅ 请假申请提交成功！<br>系统已直接自动记录，回公司后请向 HR 提交 MC 正本。
  </div>
</div>

<script>
// 41位员工名册
const employeeDatabase = [

  {id: "328", name: "TAN KYLE", dept: "Operations / HR"},
  {id: "329", name: "MAHAJI", dept: "Injection Trial"}
];

// 初始化
window.onload = function() {
  const select = document.getElementById("empSelect");
  employeeDatabase.forEach(emp => {
    let opt = document.createElement("option");
    opt.value = emp.id;
    opt.textContent = `[工号 ${emp.id}] ${emp.name}`;
    select.appendChild(opt);
  });
  document.getElementById("leaveDate").value = new Date().toISOString().substring(0, 10);
};

// 搜工号带出部门
function onEmployeeChange() {
  const id = document.getElementById("empSelect").value;
  const emp = employeeDatabase.find(e => e.id === id);
  document.getElementById("deptInput").value = emp ? emp.dept : "";
}

// 切换假别代码
function chooseType(type) {
  document.getElementById("leaveType").value = type;
  document.getElementById("cardMC").className = "type-card" + (type==='MC'?' active-mc':'');
  document.getElementById("cardEL").className = "type-card" + (type==='EL'?' active-el':'');
  document.getElementById("cardAL").className = "type-card" + (type==='AL'?' active-al':'');
  
  // 选择 MC 时强制要求拍摄上传
  document.getElementById("mcSection").style.display = (type === 'MC') ? 'block' : 'none';
}

function onFileSelected(input) {
  if (input.files && input.files[0]) {
    document.getElementById("uploadLabel").innerHTML = "✅ 已成功选择病单: " + input.files[0].name;
  }
}

function submitLeaveApp() {
  const empId = document.getElementById("empSelect").value;
  if (!empId) {
    alert("请先选择您的姓名/工号！");
    return;
  }
  
  const leaveType = document.getElementById("leaveType").value;
  const mcFile = document.getElementById("mcCamera").files;
  
  if (leaveType === 'MC' && mcFile.length === 0) {
    alert("⚠️ 病假 (MC) 申请必须拍照上传诊所 MC 病单！");
    return;
  }

  document.getElementById("successMessage").style.display = "block";
  setTimeout(() => {
    document.getElementById("successMessage").style.display = "none";
    document.getElementById("eLeaveForm").reset();
    chooseType('MC');
  }, 4000);
}
</script>

</body>
</html>
