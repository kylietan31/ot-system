<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Overtime Form</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #0284c7;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .sheet-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
        }

        .sheet-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .sheet-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .btn-delete-sheet {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .company-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .company-info h3 {
            margin: 0;
            color: #0f172a;
        }

        .company-info p {
            margin: 2px 0;
            font-size: 0.8rem;
            color: #64748b;
        }

        .form-title {
            text-align: right;
            color: var(--primary-color);
        }

        .form-title h2 { margin: 0; }
        .form-title span { font-size: 0.75rem; color: #dc2626; font-weight: bold; }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .form-group label { white-space: nowrap; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 8px;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
        }

        td {
            padding: 6px;
            border: 1px solid #cbd5e1;
            text-align: center;
        }

        td input, td select {
            width: 95%;
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
        }

        .btn-remove-row {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add-row { background-color: var(--success-color); color: white; }
        .btn-save { background-color: var(--secondary-color); color: white; }
        .btn-print { background-color: var(--primary-color); color: white; }

        .bottom-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-add-sheet {
            background-color: #0d9488;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-copy-sheet {
            background-color: #7c3aed;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .signatures {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .sig-line {
            border-top: 1px solid #000;
            margin-top: 40px;
            padding-top: 5px;
        }
    </style>
</head>
<body>

<div class="container" id="sheetsContainer">
    <!-- Sheets will be generated dynamically -->
</div>

<div class="bottom-actions">
    <button class="btn-add-sheet" onclick="addNewSheet()">📄 + Add New Blank Sheet</button>
    <button class="btn-copy-sheet" onclick="copyPreviousSheet()">📋 + Copy Previous Sheet</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Print / Save All PDF</button>
</div>

<script>
// 部门与 HOD 自动匹配关联表
const hodDatabase = {
    "Design & CAD": "CHAN KENG LEONG",
    "CNC": "WONG KONG MING",
    "EDM": "TAN CHEE KEONG",
    "QC": "LEONG KAM YEW",
    "ADMIN": "TAN KYLE"
};

let sheetCount = 0;

function createSheetData() {
    sheetCount++;
    const today = new Date().toISOString().split('T')[0];
    
    const card = document.createElement('div');
    card.className = 'sheet-card';
    card.id = `sheet-${sheetCount}`;

    card.innerHTML = `
        <div class="sheet-header-bar">
            <span class="sheet-title">Sheet #${sheetCount}</span>
            <button class="btn-delete-sheet" onclick="deleteSheet('sheet-${sheetCount}')">🗑️ Delete Sheet</button>
        </div>
        <div class="company-header">
            <div class="company-info">
                <h3>Kaizen Mould Technology Sdn. Bhd. <small>(890951-A)</small></h3>
                <p>24, Jalan Seruling 58, Taman Klang Jaya Industrial Park, 41200 Klang, Selangor.</p>
                <p>Tel: 03-3325 9111 / 9555 | Fax: 03-3318 5797</p>
            </div>
            <div class="form-title">
                <h2>Daily Overtime Form</h2>
                <span>Submission Deadline: 16:30 (Following Working Day)</span>
            </div>
        </div>

        <div class="meta-grid">
            <div class="form-group">
                <label>Department:</label>
                <select class="dept-select" onchange="autoFillHOD(this)">
                    <option value="">-- Select --</option>
                    <option value="Design & CAD">Design & CAD</option>
                    <option value="CNC">CNC</option>
                    <option value="EDM">EDM</option>
                    <option value="QC">QC</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <div class="form-group">
                <label>HOD Name:</label>
                <input type="text" class="hod-input" placeholder="HOD Name">
            </div>
            <div class="form-group">
                <label>OT Date:</label>
                <input type="date" value="${today}">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">No.</th>
                    <th style="width: 20%;">Employee</th>
                    <th style="width: 15%;">Start Time</th>
                    <th style="width: 15%;">End Time</th>
                    <th style="width: 10%;">Hours</th>
                    <th style="width: 15%;">OT Category</th>
                    <th style="width: 15%;">Purpose / Reason</th>
                    <th style="width: 5%;">Action</th>
                </tr>
            </thead>
            <tbody class="table-body">
                <!-- Rows dynamically added -->
            </tbody>
        </table>

        <button class="btn btn-add-row" onclick="addRow(this)">+ Add Row</button>

        <div class="signatures">
            <div class="sig-line">Applicant Signature</div>
            <div class="sig-line">HOD Approval</div>
            <div class="sig-line">HR Received</div>
        </div>
    `;

    document.getElementById('sheetsContainer').appendChild(card);
    addRow(card.querySelector('.btn-add-row')); // 默认添加第一行
}

// 自动填充 HOD 名字
function autoFillHOD(selectElem) {
    const card = selectElem.closest('.sheet-card');
    const hodInput = card.querySelector('.hod-input');
    const selectedDept = selectElem.value;
    
    if (hodDatabase[selectedDept]) {
        hodInput.value = hodDatabase[selectedDept];
    } else {
        hodInput.value = "";
    }
}

// 增加行
function addRow(btn) {
    const tbody = btn.closest('.sheet-card').querySelector('.table-body');
    const rowCount = tbody.children.length + 1;
    const tr = document.createElement('tr');

    tr.innerHTML = `
        <td>${rowCount}</td>
        <td><input type="text" placeholder="Employee Name"></td>
        <td><input type="time" onchange="calcHours(this)"></td>
        <td><input type="time" onchange="calcHours(this)"></td>
        <td><input type="number" class="hours-val" value="0.0" readonly style="background:#e2e8f0;"></td>
        <td>
            <select>
                <option value="Normal">Normal OT</option>
                <option value="RestDay">Rest Day</option>
                <option value="PH">Public Holiday</option>
            </select>
        </td>
        <td><input type="text" placeholder="Reason / Project No."></td>
        <td><button class="btn-remove-row" onclick="removeRow(this)">X</button></td>
    `;
    tbody.appendChild(tr);
}

// 计算时间
function calcHours(inputElem) {
    const tr = inputElem.closest('tr');
    const inputs = tr.querySelectorAll('input[type="time"]');
    const start = inputs[0].value;
    const end = inputs[1].value;
    
    if (start && end) {
        const startDate = new Date(`1970-01-01T${start}:00`);
        let endDate = new Date(`1970-01-01T${end}:00`);
        if (endDate < startDate) endDate.setDate(endDate.getDate() + 1);
        
        const diffHours = ((endDate - startDate) / (1000 * 60 * 60)).toFixed(1);
        tr.querySelector('.hours-val').value = diffHours;
    }
}

// 删除整页 Sheet
function deleteSheet(sheetId) {
    const sheet = document.getElementById(sheetId);
    if (document.querySelectorAll('.sheet-card').length > 1) {
        sheet.remove();
    } else {
        alert("至少需要保留一个 Sheet！");
    }
}

// 新增空白页
function addNewSheet() {
    createSheetData();
}

// 复制上一页 Sheet
function copyPreviousSheet() {
    const container = document.getElementById('sheetsContainer');
    const lastSheet = container.lastElementChild;
    
    if (!lastSheet) {
        addNewSheet();
        return;
    }

    createSheetData();
    const newSheet = container.lastElementChild;

    // 复制部门与 HOD
    const lastDept = lastSheet.querySelector('.dept-select').value;
    const lastHOD = lastSheet.querySelector('.hod-input').value;
    newSheet.querySelector('.dept-select').value = lastDept;
    newSheet.querySelector('.hod-input').value = lastHOD;
}

// 页面初始化
window.onload = function() {
    createSheetData();
};
</script>

</body>
</html>
