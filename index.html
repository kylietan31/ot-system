<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kaizen Mould Technology Sdn. Bhd. - OT System</title>
  <style>
    :root {
      --primary-blue: #1b365d;
      --accent-blue: #2b579a;
      --light-blue-bg: #eef5ff;
      --border-blue: #c7dcfe;
      --green-btn: #10b981;
      --orange-btn: #f59e0b;
      --dark-btn: #475569;
      --red-btn: #ef4444;
      --text-main: #1e293b;
      --bg-body: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      color: var(--primary-blue);
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 6px 0;
    }

    .header .subtitle {
      color: #64748b;
      font-size: 14px;
    }

    /* Multi-device sync badge */
    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 8px;
      border: 1px solid #bae6fd;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
    }

    /* Department Selector Box */
    .dept-card {
      background-color: var(--light-blue-bg);
      border: 1px solid var(--border-blue);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .dept-left {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
    }

    .dept-label {
      font-weight: 700;
      color: var(--primary-blue);
      font-size: 14px;
      white-space: nowrap;
    }

    .dept-select {
      width: 100%;
      max-width: 380px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 14px;
      color: #334155;
      font-weight: 600;
    }

    .dept-info {
      text-align: right;
      font-size: 13px;
      color: #334155;
    }

    .dept-info span {
      font-weight: 700;
      color: var(--primary-blue);
    }

    /* Navigation Tabs */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 6px 6px 0 0;
      border: none;
      background-color: #f1f5f9;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background-color: var(--primary-blue);
      color: #ffffff;
    }

    /* Table Styling */
    .table-responsive {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background-color: #f8fafc;
      color: var(--primary-blue);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
    }

    th:last-child {
      border-right: none;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    td:last-child {
      border-right: none;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      color: #334155;
      background: #fff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(43, 87, 154, 0.15);
    }

    /* Action Buttons */
    .action-bar {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-add { background-color: var(--dark-btn); }
    .btn-confirm { background-color: var(--green-btn); }
    .btn-pending { background-color: var(--orange-btn); }
    .btn-delete { 
      background-color: var(--red-btn); 
      padding: 6px 10px; 
      border-radius: 4px;
      justify-content: center;
    }

    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Section -->
    <div class="header">
      <h1>Kaizen Mould Technology Sdn. Bhd.</h1>
      <div class="subtitle">Daily Overtime Management System / 每日加班管理系统</div>
      <div class="sync-status">
        <span class="sync-dot"></span>
        <span id="sync-label">多设备实时同步中</span>
      </div>
    </div>

    <!-- Department Header Card -->
    <div class="dept-card">
      <div class="dept-left">
        <label class="dept-label" for="dept-select">Select Department / Pilih Jabatan / 选择部门:</label>
        <select id="dept-select" class="dept-select" onchange="syncData()">
          <option value="ADMIN">ADMIN</option>
          <option value="PRODUCTION">PRODUCTION</option>
          <option value="QUALITY">QUALITY CONTROL</option>
          <option value="MAINTENANCE">MAINTENANCE</option>
        </select>
      </div>
      <div class="dept-info">
        <div>Department / 部门: <span id="dept-name">ADMIN</span></div>
        <div>HOD Approval / 部门主管: <span id="hod-name">KALAISELVI</span></div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active">📝 Submit OT / Hantar OT / 登记提交</button>
      <button class="tab-btn">👤 My Records / Rekod Saya / 个人记录</button>
      <button class="tab-btn">📁 HR Archive / Arkib HR / 月度归档</button>
      <button class="tab-btn" onclick="clearAllRecords()">🗑️ Clear Records / Padam Rekod</button>
    </div>

    <!-- OT Entry Table -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width: 15%;">Employee / 姓名</th>
            <th style="width: 12%;">Emp ID / 工号</th>
            <th style="width: 15%;">Date / 日期</th>
            <th style="width: 13%;">Start Time / 开始</th>
            <th style="width: 13%;">End Time / 结束</th>
            <th style="width: 10%;">Hours / 小时</th>
            <th style="width: 16%;">Purpose & Reason / 原因</th>
            <th style="width: 6%; text-align: center;">Action / 操作</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <!-- Bottom Action Bar -->
    <div class="action-bar">
      <button class="btn btn-add" onclick="addRow()">➕ Add Row / Tambah / 添加新行</button>
      <button class="btn btn-confirm" onclick="syncData()">✅ Confirm Submission / 确认提交</button>
      <button class="btn btn-pending" onclick="syncData()">⏳ Save PENDING / PENDING 上交</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // 1. Paste your Firebase Web Config details here
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('ot_submissions');

    // Load initial empty row if no data
    const tbody = document.getElementById('table-body');
    const deptSelect = document.getElementById('dept-select');
    const deptName = document.getElementById('dept-name');

    deptSelect.addEventListener('change', () => {
      deptName.textContent = deptSelect.value;
    });

    // Real-time listener: Triggers automatically across ALL connected devices when data changes
    db.on('value', (snapshot) => {
      const data = snapshot.val();
      tbody.innerHTML = '';

      if (data && data.rows && data.rows.length > 0) {
        if (data.department) {
          deptSelect.value = data.department;
          deptName.textContent = data.department;
        }
        data.rows.forEach(rowData => createRowElement(rowData));
      } else {
        createRowElement(); // default blank row
      }
    });

    function createRowElement(data = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" class="emp-name" value="${data.name || ''}" placeholder="Type or Select Name" oninput="syncData()" /></td>
        <td><input type="text" class="emp-id" value="${data.id || ''}" placeholder="ID" oninput="syncData()" /></td>
        <td><input type="date" class="emp-date" value="${data.date || '2026-09-14'}" onchange="syncData()" /></td>
        <td><input type="time" class="emp-start" value="${data.start || '17:00'}" onchange="syncData()" /></td>
        <td><input type="time" class="emp-end" value="${data.end || '21:00'}" onchange="syncData()" /></td>
        <td><input type="number" step="0.5" class="emp-hours" value="${data.hours || '4.0'}" oninput="syncData()" /></td>
        <td><input type="text" class="emp-reason" value="${data.reason || ''}" placeholder="Reason / Project" oninput="syncData()" /></td>
        <td style="text-align: center;">
          <button class="btn btn-delete" onclick="deleteRow(this)" title="Delete Row">🗑️</button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    function addRow() {
      createRowElement();
      syncData();
    }

    function deleteRow(btn) {
      btn.closest('tr').remove();
      syncData();
    }

    function clearAllRecords() {
      if (confirm("Are you sure you want to clear all records?")) {
        db.set({ department: deptSelect.value, rows: [] });
      }
    }

    // Push local state to Firebase in real time
    let syncTimer;
    function syncData() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        const rows = [];
        document.querySelectorAll('#table-body tr').forEach(tr => {
          rows.push({
            name: tr.querySelector('.emp-name').value,
            id: tr.querySelector('.emp-id').value,
            date: tr.querySelector('.emp-date').value,
            start: tr.querySelector('.emp-start').value,
            end: tr.querySelector('.emp-end').value,
            hours: tr.querySelector('.emp-hours').value,
            reason: tr.querySelector('.emp-reason').value
          });
        });

        db.set({
          department: deptSelect.value,
          rows: rows
        });
      }, 300); // Debounce to prevent rapid network calls while typing
    }
  </script>
</body>
</html>
