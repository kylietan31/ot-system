<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen Mould Technology - Daily Overtime Management System / 每日加班管理系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f8fafc; color: #334155; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #e2e8f0; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #1e3a8a, #312e81); color: #ffffff; padding: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header p { color: #93c5fd; font-size: 14px; margin-top: 4px; }
        .sync-badge { background-color: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.4); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #6ee7b7; display: flex; items-center; gap: 8px; }
        .dot { width: 8px; height: 8px; background-color: #34d399; border-radius: 50%; display: inline-block; }

        /* Controls */
        .controls { background: #f1f5f9; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .dept-select-group { display: flex; align-items: center; gap: 10px; }
        .dept-select-group label { font-size: 14px; font-weight: 600; color: #475569; }
        select { background: #fff; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 6px; font-size: 14px; outline: none; cursor: pointer; }
        .info-card { background: #fff; padding: 8px 16px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; display: flex; gap: 16px; }
        .info-card span.highlight { font-weight: 700; color: #1e3a8a; }

        /* Form */
        .form-section { padding: 24px; border-bottom: 1px solid #e2e8f0; }
        .form-section h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 16px; letter-spacing: 0.5px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #475569; }
        .form-group input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
        .time-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .full-width { grid-column: 1 / -1; }
        .btn-submit { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; height: max-content; align-self: flex-end; }
        .btn-submit:hover { background: #1d4ed8; }

        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #f8fafc; color: #475569; padding: 12px 16px; font-weight: 600; text-transform: uppercase; font-size: 12px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        tr:hover { background: #f8fafc; }
        .btn-delete { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-delete:hover { background: #fee2e2; }

        /* Footer */
        .footer { padding: 16px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>Kaizen Mould Technology Sdn. Bhd.</h1>
                <p>Daily Overtime Management System / 每日加班管理系统</p>
            </div>
            <div class="sync-badge">
                <span class="dot"></span>
                <span>多设备实时同步中</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="dept-select-group">
                <label for="deptSelect">Department / 部门:</label>
                <select id="deptSelect">
                    <option value="ADMIN">ADMIN</option>
                    <option value="PRODUCTION">PRODUCTION</option>
                    <option value="QUALITY CONTROL">QUALITY CONTROL</option>
                    <option value="MAINTENANCE">MAINTENANCE</option>
                </select>
            </div>
            <div class="info-card">
                <div>部门: <span id="currentDeptLabel" class="highlight">ADMIN</span></div>
                <div>主管: <span id="hodLabel" class="highlight">KALAISELVI</span></div>
            </div>
        </div>

        <!-- Form -->
        <div class="form-section">
            <h2>Add Overtime Record / 添加加班记录</h2>
            <form id="otForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Employee Name / 姓名</label>
                        <input type="text" id="empName" required placeholder="e.g. Tan Kyle">
                    </div>
                    <div class="form-group">
                        <label>Emp ID / 工号</label>
                        <input type="text" id="empId" required placeholder="e.g. KM-1024">
                    </div>
                    <div class="form-group">
                        <label>Date / 日期</label>
                        <input type="date" id="otDate" required>
                    </div>
                    <div class="form-group">
                        <label>Start - End Time / 时间段</label>
                        <div class="time-group">
                            <input type="time" id="startTime" required>
                            <input type="time" id="endTime" required>
                        </div>
                    </div>
                    <div class="form-group full-width" style="display: flex; gap: 16px; align-items: flex-end;">
                        <div style="flex: 1;">
                            <label>Purpose & Reason / 加班原因说明</label>
                            <input type="text" id="otReason" required placeholder="e.g. Urgent machine maintenance / 紧急机器维修">
                        </div>
                        <button type="submit" class="btn-submit">+ 提交记录</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>工号</th>
                        <th>日期</th>
                        <th>开始</th>
                        <th>结束</th>
                        <th>小时</th>
                        <th>加班原因</th>
                        <th style="text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="otTableBody">
                    <!-- 动态生成记录 -->
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div id="recordCount">Total Records: 0</div>
            <div>Kaizen Mould Technology Sdn. Bhd. © 2026</div>
        </div>
    </div>

    <script>
        document.getElementById('otDate').valueAsDate = new Date();

        const hodMapping = {
            "ADMIN": "KALAISELVI",
            "PRODUCTION": "MOHD RAZAK",
            "QUALITY CONTROL": "LIM TECK HOCK",
            "MAINTENANCE": "MR. KUMAR"
        };

        const deptSelect = document.getElementById('deptSelect');
        const currentDeptLabel = document.getElementById('currentDeptLabel');
        const hodLabel = document.getElementById('hodLabel');

        deptSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            currentDeptLabel.textContent = val;
            hodLabel.textContent = hodMapping[val] || "KALAISELVI";
            loadRecords();
        });

        function getStorageKey() {
            return `kaizen_ot_${deptSelect.value}`;
        }

        function loadRecords() {
            const tbody = document.getElementById('otTableBody');
            tbody.innerHTML = '';
            const data = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            
            document.getElementById('recordCount').textContent = `Total Records: ${data.length}`;

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 32px; color: #94a3b8;">暂无加班记录 (No overtime records found)</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${item.empName}</td>
                    <td style="color: #64748b;">${item.empId}</td>
                    <td>${item.otDate}</td>
                    <td>${item.startTime}</td>
                    <td>${item.endTime}</td>
                    <td style="font-weight: 700; color: #2563eb;">${item.hours} hrs</td>
                    <td>${item.otReason}</td>
                    <td style="text-align: center;">
                        <button onclick="deleteRecord(${index})" class="btn-delete">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('otForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const empName = document.getElementById('empName').value;
            const empId = document.getElementById('empId').value;
            const otDate = document.getElementById('otDate').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const otReason = document.getElementById('otReason').value;

            const start = new Date(`1970-01-01T${startTime}:00`);
            const end = new Date(`1970-01-01T${endTime}:00`);
            let diff = (end - start) / 36e5;
            if(diff < 0) diff += 24;

            const newRecord = { empName, empId, otDate, startTime, endTime, hours: diff.toFixed(1), otReason };

            const data = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            data.push(newRecord);
            localStorage.setItem(getStorageKey(), JSON.stringify(data));

            document.getElementById('empName').value = '';
            document.getElementById('empId').value = '';
            document.getElementById('otReason').value = '';
            
            loadRecords();
        });

        function deleteRecord(index) {
            if(confirm('确定要删除这条加班记录吗？')) {
                const data = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
                data.splice(index, 1);
                localStorage.setItem(getStorageKey(), JSON.stringify(data));
                loadRecords();
            }
        }

        loadRecords();
    </script>
</body>
</html>
