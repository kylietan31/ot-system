<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Overtime Form</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #0284c7;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .sheet-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
        }

        .sheet-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .sheet-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .btn-delete-sheet {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .company-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .company-info h3 {
            margin: 0;
            color: #0f172a;
        }

        .company-info p {
            margin: 2px 0;
            font-size: 0.8rem;
            color: #64748b;
        }

        .form-title {
            text-align: right;
            color: var(--primary-color);
        }

        .form-title h2 { margin: 0; }
        .form-title span { font-size: 0.75rem; color: #dc2626; font-weight: bold; }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .form-group label { white-space: nowrap; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 8px;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
        }

        td {
            padding: 6px;
            border: 1px solid #cbd5e1;
            text-align: center;
            vertical-align: top;
        }

        td input, td select {
            width: 95%;
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
        }

        .img-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
            justify-content: center;
        }

        .img-preview-container img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }

        .btn-remove-row {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .bottom-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-add-sheet {
            background-color: #0d9488;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-copy-sheet {
            background-color: #7c3aed;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add-row {
            background-color: var(--success-color);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save-pdf {
            background-color: #0284c7;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-print-only {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .signatures {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .sig-line {
            border-top: 1px solid #000;
            margin-top: 40px;
            padding-top: 5px;
        }

        @media print {
            .bottom-actions, .btn-delete-sheet, .btn-add-row, .btn-remove-row, input[type="file"] {
                display: none !important;
            }
            .sheet-card {
                page-break-after: always;
                box-shadow: none;
                border: none;
                padding: 0;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

<div class="container" id="sheetsContainer">
    <!-- Sheets dynamically generated -->
</div>

<div class="bottom-actions">
    <button class="btn-add-sheet" onclick="addNewSheet()">📄 + Add New Sheet</button>
    <button class="btn-copy-sheet" onclick="copyPreviousSheet()">📋 + Copy Previous Sheet</button>
    <button class="btn-save-pdf" onclick="window.print()">💾 Save PDF</button>
    <button class="btn-print-only" onclick="window.print()">🖨️ Print Form</button>
</div>

<script>
// 部门与 HOD 绑定表（包含 Emp No. + 名字）
const hodDatabase = {
    "ADMIN": "328 - TAN KYLE",
    "PURCHASING": "212 - THILAGAH",
    "CAD (NO DESIGN)": "2 - CHAN KENG LEONG",
    "CNC": "2 - CHAN KENG LEONG",
    "EDM": "3 - CHONG FAT KEONG",
    "PROJECT": "3 - CHONG FAT KEONG",
    "POLISHING": "3 - CHONG FAT KEONG",
    "PRODUCTION": "3 - CHONG FAT KEONG",
    "MOULD MAKER": "272 - LEE YOONG HON",
    "QC": "266 - TAN KAH CHYE"
};

// 员工数据库
const employeeDatabase = {
  "ADMIN": [
    { "empNo": "316", "name": "KISTINNA ANAQIN" },
    { "empNo": "328", "name": "TAN KYLE" }
  ],
  "PURCHASING": [
    { "empNo": "212", "name": "THILAGAH" }
  ],
  "CAD (NO DESIGN)": [
    { "empNo": "2", "name": "CHAN KENG LEONG" },
    { "empNo": "305", "name": "ADARSH" },
    { "empNo": "274", "name": "SOH GIM BOON" },
    { "empNo": "28", "name": "HAN AYE AYE" },
    { "empNo": "60", "name": "MD KANCHAN" },
    { "empNo": "269", "name": "KHAU LIANG YU" },
    { "empNo": "300", "name": "NAY LIANG YU" },
    { "empNo": "307", "name": "MA LIK CHAN" }
  ],
  "CNC": [
    { "empNo": "27", "name": "SA MASAN BA" },
    { "empNo": "290", "name": "BHARAT" },
    { "empNo": "291", "name": "DHAN BAHADUR" },
    { "empNo": "294", "name": "MILAN" },
    { "empNo": "315", "name": "MANUPRASAD" },
    { "empNo": "325", "name": "MD FADHIL NOOR" }
  ],
  "EDM": [
    { "empNo": "3", "name": "CHONG FAT KEONG" },
    { "empNo": "302", "name": "TEE NYEIN AUNG" },
    { "empNo": "306", "name": "KAYW ZIN HEIN" },
    { "empNo": "318", "name": "YUVANNESH" }
  ],
  "PROJECT": [
    { "empNo": "257", "name": "MD ZAINUL" },
    { "empNo": "262", "name": "NUR SYAHIRAH" }
  ],
  "POLISHING": [
    { "empNo": "19", "name": "MD SHOPON" },
    { "empNo": "299", "name": "MIN THU" }
  ],
  "PRODUCTION": [
    { "empNo": "20", "name": "MD SHAHABUDIN" },
    { "empNo": "68", "name": "MD ALAMGIR" },
    { "empNo": "301", "name": "SHAING THU AUNG" }
  ],
  "MOULD MAKER": [
    { "empNo": "69", "name": "MD JAHIR" },
    { "empNo": "72", "name": "MD JAHANGIR" },
    { "empNo": "272", "name": "LEE YOONG HON" },
    { "empNo": "286", "name": "HING YONG HOW" },
    { "empNo": "303", "name": "ZAW MYO HTIKE" },
    { "empNo": "310", "name": "AMARNATH" },
    { "empNo": "311", "name": "JAISON" },
    { "empNo": "319", "name": "VIMALKUMAR" },
    { "empNo": "322", "name": "SARATH" },
    { "empNo": "326", "name": "GOH CHEE KUAN" }
  ],
  "QC": [
    { "empNo": "266", "name": "TAN KAH CHYE" },
    { "empNo": "323", "name": "NUR LIANA SOFIA" }
  ]
};

let sheetCount = 0;

function createSheetData() {
    sheetCount++;
    const today = new Date().toISOString().split('T')[0];
    
    const card = document.createElement('div');
    card.className = 'sheet-card';
    card.id = `sheet-${sheetCount}`;

    card.innerHTML = `
        <div class="sheet-header-bar">
            <span class="sheet-title">Sheet #${sheetCount}</span>
            <button class="btn-delete-sheet" onclick="deleteSheet('sheet-${sheetCount}')">🗑️ Delete Sheet</button>
        </div>
        <div class="company-header">
            <div class="company-info">
                <h3>Kaizen Mould Technology Sdn. Bhd. <small>(890951-A)</small></h3>
                <p>24, Jalan Seruling 58, Taman Klang Jaya Industrial Park, 41200 Klang, Selangor.</p>
                <p>Tel: 03-3325 9111 / 9555 | Fax: 03-3318 5797</p>
            </div>
            <div class="form-title">
                <h2>Daily Overtime Form</h2>
                <span>Submission Deadline: 16:30 (Following Working Day)</span>
            </div>
        </div>

        <div class="meta-grid">
            <div class="form-group">
                <label>Department:</label>
                <select class="dept-select" onchange="onDepartmentChange(this)">
                    <option value="">-- Select Department --</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="PURCHASING">PURCHASING</option>
                    <option value="CAD (NO DESIGN)">CAD (NO DESIGN)</option>
                    <option value="CNC">CNC</option>
                    <option value="EDM">EDM</option>
                    <option value="PROJECT">PROJECT</option>
                    <option value="POLISHING">POLISHING</option>
                    <option value="PRODUCTION">PRODUCTION</option>
                    <option value="MOULD MAKER">MOULD MAKER</option>
                    <option value="QC">QC</option>
                </select>
            </div>
            <div class="form-group">
                <label>HOD Name:</label>
                <input type="text" class="hod-input" placeholder="Head of Dept" readonly style="background:#f1f5f9; font-weight:bold;">
            </div>
            <div class="form-group">
                <label>OT Date:</label>
                <input type="date" value="${today}" min="${today}" max="${today}" readonly style="background:#f1f5f9; font-weight:bold;">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 4%;">No.</th>
                    <th style="width: 22%;">Employee</th>
                    <th style="width: 12%;">Start Time</th>
                    <th style="width: 12%;">End Time</th>
                    <th style="width: 8%;">Hours</th>
                    <th style="width: 12%;">OT Category</th>
                    <th style="width: 13%;">Purpose / Reason</th>
                    <th style="width: 12%;">Attach Pictures</th>
                    <th style="width: 5%;">Action</th>
                </tr>
            </thead>
            <tbody class="table-body">
                <!-- Rows dynamically added -->
            </tbody>
        </table>

        <button class="btn-add-row" onclick="addRow(this)">+ Add Row</button>

        <div class="signatures">
            <div class="sig-line">Applicant Signature</div>
            <div class="sig-line">HOD Approval</div>
            <div class="sig-line">HR Received</div>
        </div>
    `;

    document.getElementById('sheetsContainer').appendChild(card);
    addRow(card.querySelector('.btn-add-row'));
}

function onDepartmentChange(selectElem) {
    const card = selectElem.closest('.sheet-card');
    const hodInput = card.querySelector('.hod-input');
    const selectedDept = selectElem.value;

    hodInput.value = hodDatabase[selectedDept] || "";

    const employeeSelects = card.querySelectorAll('.emp-select');
    employeeSelects.forEach(select => {
        updateEmpDropdownOptions(select, selectedDept);
    });
}

function updateEmpDropdownOptions(selectElem, dept) {
    selectElem.innerHTML = `<option value="">-- Select Employee --</option>`;
    if (dept && employeeDatabase[dept]) {
        employeeDatabase[dept].forEach(emp => {
            selectElem.innerHTML += `<option value="${emp.empNo}">${emp.empNo} - ${emp.name}</option>`;
        });
    } else {
        selectElem.innerHTML = `<option value="">-- Select Department First --</option>`;
    }
}

function addRow(btn) {
    const card = btn.closest('.sheet-card');
    const tbody = card.querySelector('.table-body');
    const selectedDept = card.querySelector('.dept-select').value;
    const rowCount = tbody.children.length + 1;
    const tr = document.createElement('tr');

    tr.innerHTML = `
        <td>${rowCount}</td>
        <td>
            <select class="emp-select">
                <!-- Dynamic based on selected department -->
            </select>
        </td>
        <td><input type="time" onchange="calcHours(this)"></td>
        <td><input type="time" onchange="calcHours(this)"></td>
        <td><input type="number" class="hours-val" value="0.0" readonly style="background:#e2e8f0;"></td>
        <td>
            <select>
                <option value="Normal">Normal OT (1.5x)</option>
                <option value="RestDay">Rest Day (2.0x)</option>
            </select>
        </td>
        <td><input type="text" placeholder="Reason / Project No."></td>
        <td>
            <input type="file" accept="image/*" multiple onchange="previewImages(this)">
            <div class="img-preview-container"></div>
        </td>
        <td><button class="btn-remove-row" onclick="removeRow(this)">X</button></td>
    `;
    tbody.appendChild(tr);

    const newEmpSelect = tr.querySelector('.emp-select');
    updateEmpDropdownOptions(newEmpSelect, selectedDept);
}

function previewImages(inputElem) {
    const container = inputElem.parentElement.querySelector('.img-preview-container');
    container.innerHTML = '';
    if (inputElem.files) {
        Array.from(inputElem.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;
                container.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    }
}

function removeRow(btn) {
    const row = btn.closest('tr');
    const tbody = row.closest('tbody');
    row.remove();
    Array.from(tbody.children).forEach((tr, index) => {
        tr.children[0].textContent = index + 1;
    });
}

function calcHours(inputElem) {
    const tr = inputElem.closest('tr');
    const inputs = tr.querySelectorAll('input[type="time"]');
    const start = inputs[0].value;
    const end = inputs[1].value;
    
    if (start && end) {
        const startDate = new Date(`1970-01-01T${start}:00`);
        let endDate = new Date(`1970-01-01T${end}:00`);
        if (endDate < startDate) endDate.setDate(endDate.getDate() + 1);
        
        const diffHours = ((endDate - startDate) / (1000 * 60 * 60)).toFixed(1);
        tr.querySelector('.hours-val').value = diffHours;
    }
}

function deleteSheet(sheetId) {
    const sheet = document.getElementById(sheetId);
    if (document.querySelectorAll('.sheet-card').length > 1) {
        sheet.remove();
    } else {
        alert("至少需要保留一个 Sheet！");
    }
}

function addNewSheet() {
    createSheetData();
}

function copyPreviousSheet() {
    const container = document.getElementById('sheetsContainer');
    const lastSheet = container.lastElementChild;
    if (!lastSheet) {
        addNewSheet();
        return;
    }

    createSheetData();
    const newSheet = container.lastElementChild;
    const lastDept = lastSheet.querySelector('.dept-select').value;

    if (lastDept) {
        const deptSelect = newSheet.querySelector('.dept-select');
        deptSelect.value = lastDept;
        onDepartmentChange(deptSelect);
    }
}

window.onload = function() {
    createSheetData();
};
</script>

</body>
</html>
